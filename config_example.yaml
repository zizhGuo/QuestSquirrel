connector:
  host: "cluster-ip"
  port: "cluster-port"
  hive_conf:
    "hive.resultset.use.unique.column.names": "false"
    "hive.execution.engine": "spark"
    "spark.executor.instances": "2"
    "spark.executor.cores": "2"
  username: "hadoop"
  password: "hadoop"
  auth: "CUSTOM"

test:
  launch: 0
  params:
    end_dt: '2024-04-28'
    gap_days: 8

steps: 
  query: 1
  report: 1
  visual: 1
  email: 1

module:
  connector_module: 'connector'
  query_module: 'query'
  report_module: 'report'
  visual_module: 'visual'
  email_module: 'email'

# demonstrate spark and hive query tasks
query:
  task_spark:
    type: 'spark'
    template_type: 'stable'
    tables: 
      - [1, 'data/quest_pacific', 'qquest_6_2_iter_1', 'EnvirChurnFisheryActivePacific', 'dws_churn_fishery_active.xlsx', 'na']
      - [1, 'data/quest_doupo', 'qquest_6_3_iter_1', 'Envir2Doupo', 'dws_envir_task2.xlsx', {'req_cat': "request_6_3", 'req_iter': "iter_1", 'req_status': "stable"}, {'NA': "NA"}]
      - [1, 'data/quest_doupo', 'qquest_6_3_iter_1', 'Envir3Doupo', 'dws_envir_task3.xlsx', {'req_cat': "request_6_3", 'req_iter': "iter_1", 'req_status': "stable"}, {'NA': "NA"}]
      - [1, 'data/quest_doupo', 'qquest_6_3_iter_1', 'Envir4Doupo', 'dws_envir_task4.xlsx', {'req_cat': "request_6_3", 'req_iter': "iter_1", 'req_status': "stable"}, {'NA': "NA"}]
      - [1, 'data/quest_doupo', 'qquest_6_3_iter_1', 'EnvirLevelFailure', 'dws_envir_breakthru_level_failure.xlsx', {'req_cat': "request_6_3", 'req_iter': "iter_1", 'req_status': "stable"}, {'NA': "NA"}]
      - [1, 'data/quest_doupo', 'qquest_6_3_iter_1', 'BreakthruLevelNonOperate', 'dws_envir_breakthru_level_non_operate.xlsx', {'req_cat': "request_6_3", 'req_iter': "iter_1", 'req_status': "stable"}, {'NA': "NA"}]
  task_fairy_1:
    temp_save_path: "data/quest_fairydemon"
    tasks_num: 8
    template_names: ['dws_mall_task1', 'dws_mall_task2' ,'dws_mall_task3' ,'dws_mall_task4', 'dws_envir_task1', 'dws_envir_task2', 'dws_envir_task3', 'dws_envir_task4']
    flags: [1, 1, 1, 1, 1, 1, 1, 1]
    tables: ['dws_mall_task1.xlsx', 'dws_mall_task2.xlsx', 'dws_mall_task3.xlsx', 'dws_mall_task4.xlsx', 'dws_envir_task1.xlsx', 'dws_envir_task2.xlsx', 'dws_envir_task3.xlsx', 'dws_envir_task4.xlsx']
    info:
      req_cat: "request_5_1"
      req_iter: "iter_2"
      req_status: "stable"
    params:
      NA: "NA"

